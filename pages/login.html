<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in · KeySprint</title>
  <link rel="icon" type="image/png" href="../assets/KeySprint_logo.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="login" data-nav="none">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ============================================================
       HEADER
       ============================================================ -->
  <header class="site-header">
    <div class="container">
      <a class="brand" href="login.html"><img class="brand-logo" src="../assets/KeySprint_logo.png" alt=""> Key<span>Sprint</span></a>
    </div>
  </header>

  <!-- ============================================================
       MAIN
       ============================================================ -->
  <main id="main" class="auth-page">
    <div class="card" style="width:100%;max-width:420px;">
      <img class="auth-logo" src="../assets/KeySprint_logo.png" alt="KeySprint logo">
      <h1>Log in</h1>
      <p class="muted">Welcome back. Log in to continue practicing.</p>

      <div id="form-alert" aria-live="polite"></div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input class="input" id="login-email" name="email" type="email" autocomplete="email">
          <span class="field-error" id="login-email-error" hidden></span>
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <div class="input-with-action">
            <input class="input" id="login-password" name="password" type="password" autocomplete="current-password">
            <button type="button" class="btn btn-secondary" data-toggle-password="login-password" aria-controls="login-password" aria-pressed="false">Show</button>
          </div>
          <span class="field-error" id="login-password-error" hidden></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <p class="muted" style="margin-top:var(--space-4);">New here? <a href="register.html">Create an account</a></p>
    </div>
  </main>

  <!-- ============================================================
       FOOTER
       ============================================================ -->
  <footer class="site-footer">
    <div class="container">
      <p>© 2026 KeySprint. Type Faster. Think Sharper. Improve Every Day.</p>
      <nav aria-label="Footer navigation">
        <a href="login.html">Log in</a>
        <a href="register.html">Create account</a>
      </nav>
    </div>
  </footer>

  <script src="../js/storage.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
